services:
  playwright-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/web-blackbox:1.0.0
    init: true
    ipc: host
    env_file:
      - .env
    environment:
      CI: "true"
      HEADLESS: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./config:/app/config:ro
      - ./output:/app/output
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
