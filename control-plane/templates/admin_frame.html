{% extends 'base.html' %}{% block title %}后台管理{% endblock %}
{% block content %}
<style>
  /* 顶栏 56px + 页签条 38px + main 内边距余量 → 用实际值替代已废弃的 --header-h/--tabs-h 变量
     （旧变量在当前壳中不存在，calc 整体失效 → iframe 高度塌陷、Admin 内容被压扁/遮挡） */
  .vb-admin-wrap{height:calc(100vh - 148px);min-height:560px;display:flex;flex-direction:column}
  .vb-admin-bar{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px}
  .vb-admin-bar .hint{font-size:12.5px;color:#999995}
  .vb-admin-framebox{flex:1;background:#fff;border:1px solid #e8e8e6;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(26,26,26,.03)}
  .vb-admin-framebox iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  @media (max-width:991.98px){.vb-admin-wrap{height:calc(100vh - 130px);min-height:480px}}
</style>
<div class="vb-admin-wrap">
  <div class="vb-admin-bar">
    <span class="hint">Django Admin 已嵌入平台框架内运行 · 站点/用例/Campaign 等数据的增删改查</span>
    <a class="ui-btn ui-btn-sm" href="/admin/" target="_blank">新窗口打开</a>
  </div>
  <div class="vb-admin-framebox">
    <iframe id="adminFrame" src="/admin/" title="后台管理"></iframe>
  </div>
</div>
{% endblock %}
