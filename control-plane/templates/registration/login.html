{% extends 'base.html' %}{% block title %}登录{% endblock %}
{% block auth_content %}
<div class="ios-card p-8">
  <div class="flex flex-col items-center mb-6">
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 via-sky-500 to-cyan-400 flex items-center justify-center font-bold text-white text-base shadow-[0_0_24px_rgba(14,165,233,0.45)]">OB</div>
    <h1 class="mt-4 text-lg font-bold text-slate-900 tracking-tight">AI 自动化测试平台</h1>
    <p class="mt-1 text-[11.5px] text-slate-400">网站黑盒自动化测试 · 流程管理 · 执行调度 · 报告中心</p>
  </div>

  {% if form.errors %}
  <div class="mb-4 flex items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-xs font-medium text-rose-700">
    <svg class="w-4 h-4 shrink-0"><use href="/static/vendor/lucide-sprite.svg#i-alert"/></svg>
    用户名或密码错误，请重试
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="ui-label">用户名</label>
      <input name="username" class="ui-input" autofocus placeholder="请输入用户名">
    </div>
    <div class="mb-5">
      <label class="ui-label">密码</label>
      <input name="password" type="password" class="ui-input" placeholder="请输入密码">
    </div>
    <button class="ui-btn ui-btn-primary btn-auth w-full text-sm">登 录</button>
  </form>

  <div class="mt-6 pt-4 border-t border-slate-100 text-center text-[10.5px] text-slate-400 font-mono">
    AI AutoTest Platform · Nginx 3008 · Playwright
  </div>
</div>
{% endblock %}
